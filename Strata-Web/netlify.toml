[build]
  publish = "."

[[plugins]]
  package = "@netlify/plugin-sitemap"

[build.environment]
  NODE_VERSION = "18"

# Redirects 301 - URLs antiguas a nueva estructura /blog/slug/

[[redirects]]
  from = "https://www.stratarevenue.com.mx/*"
  to = "https://stratarevenue.com.mx/:splat"
  status = 301
  force = true

